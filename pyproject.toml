[project]
name = "civbox"
dynamic = ["version"]
description = "Civilization in a Box: provenance-preserving evidence engine and controlled epistemic population simulator"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.162,<1",
    "numpy>=2.5.4,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "uvicorn>=0.54,<1",
]

[project.scripts]
civbox = "civbox.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.15",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/civbox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/civbox"]

[tool.uv]
required-version = ">=0.11"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "N", "T20"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and use obviously fake credentials to exercise redaction.
"tests/**" = ["S101", "S105", "S106"]
# The CLI's job is to write to stdout/stderr.
"src/civbox/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.importlinter]
root_package = "civbox"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is the foundation and imports no other civbox package"
type = "forbidden"
source_modules = ["civbox.core"]
forbidden_modules = ["civbox.api", "civbox.sim", "civbox.cli"]

[[tool.importlinter.contracts]]
name = "the simulation core is independent of web, network and application layers"
type = "forbidden"
source_modules = ["civbox.sim"]
forbidden_modules = [
    "civbox.api",
    "civbox.cli",
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx",
]
